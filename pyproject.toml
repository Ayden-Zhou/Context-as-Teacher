[project]
name = "context-as-tearcher"
version = "0.1.0"
description = "A research project"
authors = [{ name = "Zhou Yunfan", email = "zhou.yunfan@sjtu.edu.cn" }]
requires-python = ">=3.10"
dependencies = [
    "vllm",
    "pandas",
    "pyarrow",
    "numpy",
    "fire",
    "datasets",
    "trl",
    "latex2sympy2>=1.9.1",
    "math-verify>=0.1.0",
    "transformers>=5.0.0",
    "torch==2.3.0",
    "regex>=2026.1.15",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "ruff",
    "jupytext",
    "huggingface-hub[cli]>=1.3.5",
    "hf-transfer>=0.1.9",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
